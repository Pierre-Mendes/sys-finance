services:
  db:
    image: mysql:8.0
    container_name: financas-db-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db-data-prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build:
      context: .
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_SENTRY_DSN=${SENTRY_FRONTEND_DSN:-}
    container_name: financas-web-prod
    restart: always
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}  # opcional: sem ele a chave é gerada e guardada no banco
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}  # auto: Secure quando a requisição chega por HTTPS
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Strict}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-https://*.sentry.io}
      - SENTRY_DSN=${SENTRY_DSN:-}  # erros da API (PHP); com GlitchTip no Docker: http://<chave>@glitchtip:8000/<id>
      - SENTRY_FRONTEND_DSN=${SENTRY_FRONTEND_DSN:-}  # erros do navegador (Vue), repassados pelo túnel /api/monitoring/sentry
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}  # bot do Telegram (docs/guides/telegram.md)
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - APP_URL=${APP_URL:-}  # URL pública HTTPS (usada pelo bin/telegram-setup.php)
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}  # opcional: mailto: ou https:// de contato para os serviços de push
    depends_on:
      db:
        condition: service_healthy

  # Lembretes de contas a vencer (no app + Web Push): mesma imagem da web, roda a cada 15 min.
  # Cada aviso sai uma vez só, então reiniciar ou atrasar o agendador não duplica notificações.
  scheduler:
    build:
      context: .
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_SENTRY_DSN=${SENTRY_FRONTEND_DSN:-}
    container_name: financas-scheduler-prod
    restart: always
    entrypoint: ["sh", "-c", "while true; do php bin/reminders.php || true; sleep 900; done"]
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - APP_ENV=production
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}  # lembretes também no Telegram de quem vinculou o bot
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy

  # Backup diário do banco em ./backups (no host), com retenção de 14 dias. O deploy também
  # faz um backup antes de rodar as migrations. Restaurar: veja docs/guides/vps.md ("Backup e restauração").
  backup:
    image: mysql:8.0
    container_name: financas-backup-prod
    restart: always
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backup/restore.sh:/usr/local/bin/restore.sh:ro
    depends_on:
      db:
        condition: service_healthy

  # Só sobe sob demanda (docker compose -f docker-compose.prod.yml --profile admin up -d phpmyadmin)
  # e só escuta em 127.0.0.1: acesse por túnel SSH (ssh -L 8084:127.0.0.1:8084 usuario@vps) e entre
  # com usuário/senha do banco. Nunca publique o phpMyAdmin na internet nem com login automático.
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: financas-pma-prod
    profiles: ["admin"]
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data-prod:
