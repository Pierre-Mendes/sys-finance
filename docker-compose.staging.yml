services:
  db-staging:
    image: mysql:8.0
    container_name: financas-db-staging
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: money_manager_staging
    volumes:
      - db-data-staging:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web-staging:
    build:
      context: .
      args:
        - VITE_API_BASE_URL=http://localhost:8082
    container_name: financas-web-staging
    ports:
      - "8082:80"
    environment:
      - DB_HOST=db-staging
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=money_manager_staging
      - APP_ENV=staging
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-https://*.sentry.io}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db-staging:
        condition: service_healthy

  phpmyadmin-staging:
    image: phpmyadmin/phpmyadmin
    container_name: financas-pma-staging
    environment:
      PMA_HOST: db-staging
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8083:80"
    depends_on:
      db-staging:
        condition: service_healthy

volumes:
  db-data-staging:
