services:
  db-staging:
    image: mysql:8.0
    container_name: financas-db-staging
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: money_manager_staging
    volumes:
      - db-data-staging:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"  # só local/túnel SSH: a senha de staging é fraca
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web-staging:
    build:
      context: .
      args:
        - VITE_API_BASE_URL=http://localhost:8082
    container_name: financas-web-staging
    ports:
      - "8082:80"
    environment:
      - DB_HOST=db-staging
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=money_manager_staging
      - APP_ENV=staging
      - JWT_SECRET=${JWT_SECRET:-}  # opcional: sem ele a chave é gerada e guardada no banco
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}  # auto: Secure quando a requisição chega por HTTPS
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Strict}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-https://*.sentry.io}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}  # opcional: mailto: ou https:// de contato para os serviços de push
    depends_on:
      db-staging:
        condition: service_healthy

  # Lembretes de contas a vencer (no app + Web Push): mesma imagem da web, roda a cada 15 min.
  # Cada aviso sai uma vez só, então reiniciar ou atrasar o agendador não duplica notificações.
  scheduler-staging:
    build:
      context: .
      args:
        - VITE_API_BASE_URL=http://localhost:8082
    container_name: financas-scheduler-staging
    restart: always
    entrypoint: ["sh", "-c", "while true; do php bin/reminders.php || true; sleep 900; done"]
    environment:
      - DB_HOST=db-staging
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=money_manager_staging
      - APP_ENV=staging
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    depends_on:
      db-staging:
        condition: service_healthy

  phpmyadmin-staging:
    image: phpmyadmin/phpmyadmin
    container_name: financas-pma-staging
    profiles: ["admin"]
    environment:
      PMA_HOST: db-staging
    ports:
      - "127.0.0.1:8083:80"  # acesso por túnel SSH; login com usuário/senha do banco
    depends_on:
      db-staging:
        condition: service_healthy

volumes:
  db-data-staging:
