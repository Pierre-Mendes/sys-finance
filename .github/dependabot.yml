# Atualizações automáticas de dependências (PRs semanais).
#
# Só versões estáveis e já "assentadas":
# - Pré-releases (alpha, beta, rc) nunca são propostas enquanto o projeto usa versão estável (padrão do Dependabot).
# - cooldown: a versão precisa estar publicada há alguns dias antes de virar PR. Versões quebradas costumam ser
#   corrigidas ou retiradas nesse intervalo, e pacotes comprometidos são detectados antes de chegar aqui.
#   Atualizações de SEGURANÇA ignoram o cooldown e chegam na hora.
# - Patch e minor vêm agrupados num PR só; major vem em PR próprio (pode quebrar, revise o changelog).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
