# Ambiente efêmero usado pelo job de DAST (OWASP ZAP) em .github/workflows/security.yml.
# Sobe a mesma imagem de produção (Dockerfile) com um MySQL descartável.
name: sys-finance-dast

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dast-root
      MYSQL_DATABASE: money_manager
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdast-root"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ../..
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=dast-root
      - DB_NAME=money_manager
      - JWT_SECRET=dast-ephemeral-secret-not-used-anywhere-else-0123456789
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
