name: Deploy to Production

on:
  workflow_dispatch: # Manual trigger only for safety

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Entra na pasta do projeto
            mkdir -p ~/sys-finance
            cd ~/sys-finance
            # Se não for um repositório git, tenta inicializar (pode precisar de Deploy Key)
            if [ ! -d ".git" ]; then
              git clone https://github.com/Pierre-Mendes/sys-finance.git .
            else
              git pull origin main
            fi
            # Build and up the PRODUCTION environment (Port 80)
            docker compose -f docker-compose.prod.yml up -d --build
            # Run migrations for production
            docker exec financas-web-prod php vendor/bin/phinx migrate -e production
