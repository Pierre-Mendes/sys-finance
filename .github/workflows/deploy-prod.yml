name: Deploy to Production

on:
  workflow_dispatch: # Manual trigger only for safety
    inputs:
      ref:
        description: "Branch, tag ou SHA a publicar (para voltar atrás, informe o SHA da versão anterior)"
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_REF
          command_timeout: 30m
          script: |
            set -euo pipefail
            mkdir -p ~/sys-finance
            cd ~/sys-finance
            if [ ! -d ".git" ]; then
              git clone https://github.com/Pierre-Mendes/sys-finance.git .
            fi
            git fetch -q origin main
            # Roda o deploy.sh do main a partir de uma cópia: o checkout da versão alvo não altera o script em execução
            DEPLOY_SCRIPT=$(mktemp)
            git show origin/main:scripts/deploy.sh > "$DEPLOY_SCRIPT"
            SYSFINANCE_DIR="$PWD" bash "$DEPLOY_SCRIPT" "$DEPLOY_REF"
