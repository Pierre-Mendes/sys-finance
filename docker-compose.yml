services:
  db:
    image: mysql:8.0
    container_name: financas-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: money_manager
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: financas-web
    ports:
      - "8081:80"
    volumes:
      # Mapeia a pasta do projeto (root) para a pasta raiz web do apache
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=money_manager
      - APP_ENV=development
      - JWT_SECRET=${JWT_SECRET:-}  # opcional: sem ele a chave é gerada e guardada no banco
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
